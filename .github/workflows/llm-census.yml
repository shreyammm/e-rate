name: Free LLM comment census (additive)

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/fcc_corpus/**'
      - 'scripts/llm_census.py'
      - 'analysis_methods/provision_codebook_v1.json'
      - '.github/workflows/llm-census.yml'
  schedule:
    - cron: '17 * * * *' # Deadline sprint: continuously queued hourly checkpoints; sequential execution

permissions:
  contents: write

# Keep each checkpointed model run from overwriting another run's progress.
concurrency:
  group: erate-llm-census
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check whether source comments and outstanding filings exist
        id: pending
        run: |
          if [ ! -s data/fcc_corpus/filings.jsonl ] && [ ! -d data/fcc_corpus/comments ] && \
             [ -z "$(find data/fcc_corpus/shards -maxdepth 1 -type f -name 'filings-*.jsonl.gz' -print -quit 2>/dev/null)" ]; then
            echo 'No corpus checked in. Skipping LLM model download, no fabricated outputs.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m scripts.llm_census --input-dir data/fcc_corpus --out-dir data/llm_census_fast --pending-only | tee /tmp/erate_pending.log
          if grep -q '"pending": 0' /tmp/erate_pending.log; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify model pipeline tests before inference
        if: steps.pending.outputs.run == 'true'
        run: |
          python3 -m compileall -q scripts/llm_census.py tests/test_llm_census.py
          python3 -m unittest discover -s tests -p 'test_llm_census.py' -v
      - name: Cache downloaded open-weight model
        if: steps.pending.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: erate-ollama-granite4-1b-q4-v1
      - name: Install Ollama and free small language model
        if: steps.pending.outputs.run == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 2
          done
          ollama pull ibm/granite4:1b-q4_K_M
          ollama list
      - name: Incremental source-cited LLM analysis
        if: steps.pending.outputs.run == 'true'
        id: analysis
        run: |
          python3 -m scripts.llm_census --input-dir data/fcc_corpus \
            --out-dir data/llm_census_fast --publish-preview docs/data/llm_exploratory.json \
            --model ibm/granite4:1b-q4_K_M --limit 850 --max-chunks-per-filing 6 --max-minutes 165
      - name: Build every-claim argument landscape from all completed filings
        if: always() && steps.pending.outputs.run == 'true'
        run: |
          python3 -m pip install 'scikit-learn>=1.4,<2'
          python3 -m scripts.build_claim_landscape \
            --filings data/llm_census_fast/filings \
            --source data/fcc_corpus --output docs/data/claim_landscape.json
      - name: Refresh source-linked research findings report
        if: always() && steps.pending.outputs.run == 'true'
        run: |
          python3 -m scripts.publish_research_findings
      - name: Update aggregate preview and commit durable checkpoints
        if: always() && steps.pending.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/llm_census_fast/suggested_human_audit.json ]; then
            cp data/llm_census_fast/suggested_human_audit.json docs/data/llm_audit_queue.json
          fi
          if [ -d data/llm_census_fast ]; then git add -- data/llm_census_fast; fi
          if [ -f docs/data/llm_audit_queue.json ]; then git add -- docs/data/llm_audit_queue.json; fi
          if [ -f docs/data/llm_exploratory.json ]; then git add -- docs/data/llm_exploratory.json; fi
          if [ -f docs/data/claim_landscape.json ]; then git add -- docs/data/claim_landscape.json; fi
          if [ -f docs/data/machine_claim_rows.json ]; then git add -- docs/data/machine_claim_rows.json; fi
          if [ -f docs/findings.html ]; then git add -- docs/findings.html; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint exploratory LLM census results (machine-only)'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'No new results to checkpoint.'
          fi
