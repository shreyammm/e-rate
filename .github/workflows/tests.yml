name: Python integrity tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytical dependencies
        run: python3 -m pip install -r requirements-dashboard.txt
      - name: Verify all Python files compile
        run: python3 -m compileall -q app.py erate scripts tests
      - name: Check one-command Mac runner syntax
        run: bash -n scripts/run_local_analysis.sh
      - name: Verify direct Mac-style script execution
        run: |
          cd /tmp
          python3 "$GITHUB_WORKSPACE/scripts/build_research_snapshot.py" --help
      - name: Verify GitHub Pages JavaScript
        run: |
          node --check docs/assets/site.js
          node --check docs/assets/corpus.js
          node --check docs/assets/ask.js
          node --check docs/assets/llm.js
          node --check docs/assets/argument_map.js
          node --check docs/assets/claims.js
          node --check docs/assets/patterns.js
          node --check docs/assets/compare.js
          node --check docs/assets/ask_evidence.js
          node --check docs/assets/phrase_lab.js
          node --check docs/assets/similar.js
          node --check docs/assets/research_studio.js
          node --check docs/assets/argument_atlas.js
          node --check docs/assets/regulatory_crosswalk.js
      - name: Verify every-question full-corpus scan and relevant counterexamples
        run: node --test tests/test_ask_full_corpus.cjs
      - name: Test schema, research snapshot, provenance and topic modeling
        run: python3 -m unittest discover -s tests -v
