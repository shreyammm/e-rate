name: Build source-backed player registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_player_registry.py'
      - 'data/player_review_overrides.json'
      - 'data/fcc_corpus/**'
      - '.github/workflows/player-registry.yml'
permissions:
  contents: write
concurrency:
  group: erate-player-registry
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test identity rules
        run: python -m unittest discover -s tests -p test_player_registry.py -v
      - name: Build all-filing identity audit and organization profile index
        run: python -m scripts.build_player_registry
      - name: Verify complete source alignment and no raw commenter names
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/data/player_registry.json').read_text())
          y=json.loads(Path('docs/data/corpus_index.json').read_text())
          assert len(x['filings'])==len(y['filings'])==3231
          assert {r['id'] for r in x['filings']}=={r['id'] for r in y['filings']}
          assert sum(x['role_filing_counts'].values())==3231
          assert all('filer_raw' not in r for r in x['filings'])
          assert all('text' not in r for r in x['filings'])
          by_id={r['id']:r for r in x['filings']}
          assert by_id['26110081266']['organization']=='National Telecommunications and Information Administration'
          assert by_id['26110081266']['role']=='government'
          assert by_id['26110081279']['role']=='trade_association'
          assert by_id['26110081279']['industry_focus']=='edtech_industry'
          assert by_id['26110071262']['role']=='erate_consultant'
          assert by_id['26110071262']['organization']=='Funds For Learning, LLC'
          print('Source coverage verified; manual review queue:',x['coverage']['filings_requiring_identity_review'])
          PY
      - name: Rebuild stakeholder frequencies against freshly classified players
        run: |
          python -m unittest discover -s tests -p test_stakeholder_census.py -v
          python -m scripts.build_stakeholder_census
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          r=Path('docs/data/player_registry.json').read_bytes()
          s=json.loads(Path('docs/data/stakeholder_argument_census.json').read_text())
          assert s['inputs']['player_registry_sha256']==hashlib.sha256(r).hexdigest()
          by={x['id']:x for x in s['filings']}
          assert by['26110081358']['group']=='edtech_vendors'
          assert by['26110080790']['group']=='edtech_vendors'
          assert by['26110081358']['role']=='edtech_learning_vendor'
          assert by['26110081008']['group']=='connectivity_and_network_vendors'
          assert by['26110079982']['group']=='erate_consultants'
          assert by['26110081279']['group']=='edtech_trade_associations'
          assert not by['26110081293']['joint_filing']
          print('Same-source stakeholder census recomputed and audited.')
          PY
      - name: Publish compiled privacy-minimal player index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/player_registry.json docs/data/stakeholder_argument_census.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-backed filing-player registry with review queue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
