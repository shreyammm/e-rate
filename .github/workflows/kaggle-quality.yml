name: Refresh Kaggle Research Quality Index
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_kaggle_quality.py'
      - '.github/workflows/kaggle-quality.yml'
permissions:
  contents: write
concurrency:
  group: erate-kaggle-quality-index
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate per-filing source-linked model quality index
        run: python -m scripts.build_kaggle_quality
      - name: Publish deterministic quality flags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/kaggle/filing_quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Kaggle per-filing quality and coverage flags'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
