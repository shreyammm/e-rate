name: Build stakeholder argument census
on:
  workflow_dispatch:
  schedule:
    - cron: '14 9 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_stakeholder_census.py'
      - 'tests/test_stakeholder_census.py'
      - 'docs/data/kaggle/machine_claim_rows.json'
      - 'docs/data/kaggle/filing_quality.json'
      - 'docs/data/kaggle/claim_context_audit.json'
      - 'data/fcc_corpus/manifest.json'
      - '.github/workflows/stakeholder-census.yml'
permissions:
  contents: write
concurrency:
  group: erate-stakeholder-publish
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact stakeholder and theme counts
        run: python -m unittest discover -s tests -p test_stakeholder_census.py -v
      - name: Build all-source-file exploratory analysis
        run: python -m scripts.build_stakeholder_census
      - name: Verify full source census and no PII
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/data/stakeholder_argument_census.json').read_text())
          assert x['schema']=='stakeholder-arguments-v1'
          import hashlib
          reg=Path('docs/data/player_registry.json').read_bytes()
          ledger=Path('docs/data/kaggle/machine_claim_rows.json').read_bytes()
          assert x['inputs']['player_registry_sha256']==hashlib.sha256(reg).hexdigest()
          assert x['inputs']['machine_claim_ledger_sha256']==hashlib.sha256(ledger).hexdigest()
          by={r['id']:r for r in x['filings']}
          assert by['26110081358']['role']=='edtech_learning_vendor'
          assert by['26110080790']['group']=='edtech_vendors'
          assert by['26110079982']['group']=='erate_consultants'
          assert by['26110081008']['group']=='connectivity_and_network_vendors'
          assert x['coverage']['filings']==3231
          assert sum(x['coverage'][k] for k in ('filings_with_coded_topics','filings_without_coded_topics'))==3231
          assert sum(s['filings'] for s in x['stakeholder_groups'])==3231
          assert len({f['id'] for f in x['filings']})==3231
          for t in x['topics']:
            assert sum(v['filings'] for v in t['by_stakeholder'].values())==t['filings']
            assert all(v['distinct_source_texts']<=v['filings'] for v in t['by_stakeholder'].values())
          assert all('filer_raw' not in f and 'author_name' not in f for f in x['filings'])
          assert all(t['id'] and t['label'] for t in x['topics'])
          print('Verified filing denominators, group topics and source privacy.')
          PY
      - name: Publish site census
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never attempt to rebase two independently generated JSON ledgers:
          # refresh to the latest branch and rebuild from the SAME inputs.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.build_stakeholder_census
            git add -- docs/data/stakeholder_argument_census.json
            if git diff --cached --quiet; then
              echo 'Generated datasets already match latest sources.'
              exit 0
            fi
            git commit -m 'Publish source-aligned stakeholder argument census'
            if git push origin HEAD:main; then
              echo 'Source-aligned outputs published.'
              exit 0
            fi
            echo "Competing write; regenerate latest sources on retry ${attempt}/6" >&2
            sleep "$((attempt * 2))"
          done
          echo 'Could not publish consistent source-aligned research data.' >&2
          exit 1
