name: EXPERIMENTAL individual identity evidence audit (branch only)
on:
  push:
    branches:
      - research/identity-562-unpublished-20261102
    paths:
      - 'research/identity_562/analyze_individuals.py'
      - 'research/identity_562/test_analyze_individuals.py'
      - 'research/identity_562/diagnose_model_leads.py'
      - 'research/identity_562/deep_investigation.py'
      - 'research/identity_562/model_and_phrase_review.py'
      - 'research/identity_562/inspect_role_cues.py'
      - 'research/identity_562/source_specific_roles.py'
      - 'research/identity_562/institutional_letterhead.py'
      - 'research/identity_562/consolidate_research.py'
      - 'research/identity_562/fcc_public_metadata_crosscheck.py'
      - 'research/identity_562/test_deep_investigation.py'
      - '.github/workflows/research-identity-562.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unpublished-identity-562-research-branch
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/identity-562-unpublished-20261102
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test experimental evidence rules
        run: python -m unittest research.identity_562.test_analyze_individuals -v
      - name: Test full-document methods
        run: python -m unittest research.identity_562.test_deep_investigation -v
      - name: Run source inspection on all named-individual filings
        run: python -m research.identity_562.analyze_individuals
      - name: Investigate residual identities against entire original corpus
        run: python -m research.identity_562.deep_investigation
      - name: Reconcile independent Granite identity model and extract full-document author phrases
        run: python -m research.identity_562.model_and_phrase_review
      - name: Review redacted context around missed occupation statements
        run: python -m research.identity_562.inspect_role_cues
      - name: Find organization website and represented-organization evidence in original letters
        run: python -m research.identity_562.institutional_letterhead
      - name: Verify source-specific identity recovery candidates on original FCC text
        run: python -m research.identity_562.source_specific_roles
      - name: Consolidate all source-grounded identity evidence and separately classified argument interests
        run: python -m research.identity_562.consolidate_research
      - name: Probe official ECFS filing metadata for high-priority organization/author fields
        run: python -m research.identity_562.fcc_public_metadata_crosscheck
      - name: Inspect redacted original-source examples behind model stakeholder leads
        run: python -m research.identity_562.diagnose_model_leads
      - name: Verify no personal contact details are emitted
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('research/identity_562/results/review_queue.json')
          d=json.loads(p.read_text())
          assert d['summary']['filing_target_count']>=500
          assert len(d['records'])==d['summary']['filing_target_count']
          assert len({x['filing_id'] for x in d['records']})==len(d['records'])
          out=p.read_text()
          assert not re.search(r'[a-z0-9_.+-]+@[a-z0-9.-]+\.[a-z]{2,}',out,re.I)
          assert 'filer_raw' not in out and '"text":' not in out
          deep=json.loads(Path('research/identity_562/results/deep_full_document_evidence.json').read_text())
          assert deep['unresolved_filing_count']>=450
          mdl=json.loads(Path('research/identity_562/results/model_and_phrase_review.json').read_text())
          assert mdl['target']>350
          assert len(mdl['records'])==mdl['target']
          curated=json.loads(Path('research/identity_562/results/source_specific_identity_recovery.json').read_text())
          assert curated['newly_source_identified_filings']>=10
          letterhead=json.loads(Path('research/identity_562/results/institutional_letterhead_leads.json').read_text())
          assert letterhead['checked_filings']>=450
          final=json.loads(Path('research/identity_562/results/consolidated_identity_summary.json').read_text())
          assert final['original_distinct_normalized_filer_identifiers']==562
          assert final['new_source_supported_role_filings']+final['still_role_unstated_filings']==567
          assert len(list(Path('research/identity_562/results/consolidated_identity_review.csv').open()))==568
          assert len(deep['records'])==deep['unresolved_filing_count']
          assert len(list(Path('research/identity_562/results/identity_review_567.csv').open())) == d['summary']['filing_target_count']+1
          print('All source-file IDs audited; no names/emails/raw excerpts exported')
          PY
      - name: Keep research results on feature branch only (never publish website)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/identity_562/results/summary.json research/identity_562/results/review_queue.json research/identity_562/results/identity_review_567.csv research/identity_562/results/deep_full_document_evidence.json research/identity_562/results/model_and_phrase_review.json research/identity_562/results/source_specific_identity_recovery.json research/identity_562/results/institutional_letterhead_leads.json research/identity_562/results/consolidated_identity_summary.json research/identity_562/results/consolidated_identity_review.csv research/identity_562/results/fcc_public_metadata_crosscheck.json
          if git diff --cached --quiet; then
            echo "Unpublished evidence outputs unchanged"
          else
            git commit -m 'Research-only source identity evidence report (not website)'
            git push origin HEAD:research/identity-562-unpublished-20261102
          fi
