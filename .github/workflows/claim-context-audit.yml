name: Audit machine claim quote context
on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_claim_context.py'
      - 'scripts/build_direction_conflict_review.py'
      - 'tests/test_direction_conflict_review.py'
      - 'tests/test_claim_context_audit.py'
      - 'scripts/build_stakeholder_census.py'
      - 'docs/data/kaggle/machine_claim_rows.json'
      - 'data/fcc_corpus/**'
      - '.github/workflows/claim-context-audit.yml'
permissions:
  contents: write
concurrency:
  group: erate-claim-context-audit
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test quotation context heuristics
        run: python -m unittest discover -s tests -p test_claim_context_audit.py -v
      - name: Verify high-priority model-label triage rules
        run: python -m unittest discover -s tests -p test_direction_conflict_review.py -v
      - name: Verify source and assess every machine quote without changing LLM output
        run: python -m scripts.audit_claim_context
      - name: Assert full-source and machine-ledger coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/data/kaggle/claim_context_audit.json').read_text())
          m=json.loads(Path('data/fcc_corpus/manifest.json').read_text())
          c=json.loads(Path('docs/data/kaggle/machine_claim_rows.json').read_text())
          assert a['coverage']['source_filings_checked']==m['records']==3231
          assert a['coverage']['machine_claim_rows_checked']==len(c['rows'])
          assert a['coverage']['claim_rows_with_any_review_flag']<=len(c['rows'])
          print('PASS: complete, source-aligned quote context review candidates')
          PY
      - name: Publish source-aligned attribution-review flags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Concurrent imports can replace the machine ledger. Do not rebase
          # audit artifacts that were generated for earlier ledger contents.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.audit_claim_context
            python -m scripts.build_stakeholder_census
            python -m scripts.build_direction_conflict_review
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          ledger=Path('docs/data/kaggle/machine_claim_rows.json').read_bytes()
          result=json.loads(Path('docs/data/kaggle/claim_context_audit.json').read_text())
          assert result['machine_claim_ledger_sha256']==hashlib.sha256(ledger).hexdigest()
          assert result['coverage']['machine_claim_rows_checked']==len(json.loads(ledger)['rows'])
          census=json.loads(Path('docs/data/stakeholder_argument_census.json').read_text())
          assert census['method']['source_context_audit_sha256_verified'] is True
          assert census['inputs']['machine_claim_ledger_sha256']==result['machine_claim_ledger_sha256']
          print('PASS: audit and stakeholder frequencies use the same machine ledger')
          PY
            git add -- docs/data/kaggle/claim_context_audit.json docs/data/stakeholder_argument_census.json docs/data/kaggle/direction_conflict_review.csv docs/data/kaggle/direction_conflict_review_summary.json
            if git diff --cached --quiet; then
              echo 'Context audit already matches current source ledger.'
              exit 0
            fi
            git commit -m 'Publish source-matched machine claim context audit'
            if git push origin HEAD:main; then
              echo 'Published digest-matched quote context audit.'
              exit 0
            fi
            echo "Concurrent update; rebuilding audit on attempt ${attempt}/6" >&2
            sleep "$((attempt * 2))"
          done
          echo 'Could not publish an audit matching the current source ledger.' >&2
          exit 1
