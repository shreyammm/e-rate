name: Audit machine claim quote context
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_claim_context.py'
      - 'docs/data/kaggle/machine_claim_rows.json'
      - 'data/fcc_corpus/**'
      - '.github/workflows/claim-context-audit.yml'
permissions:
  contents: write
concurrency:
  group: erate-claim-context-audit
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test quotation context heuristics
        run: python -m unittest discover -s tests -p test_claim_context_audit.py -v
      - name: Verify source and assess every machine quote without changing LLM output
        run: python -m scripts.audit_claim_context
      - name: Assert full-source and machine-ledger coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/data/kaggle/claim_context_audit.json').read_text())
          m=json.loads(Path('data/fcc_corpus/manifest.json').read_text())
          c=json.loads(Path('docs/data/kaggle/machine_claim_rows.json').read_text())
          assert a['coverage']['source_filings_checked']==m['records']==3231
          assert a['coverage']['machine_claim_rows_checked']==len(c['rows'])
          assert a['coverage']['claim_rows_with_any_review_flag']<=len(c['rows'])
          print('PASS: complete, source-aligned quote context review candidates')
          PY
      - name: Publish conservative attribution-review flags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/kaggle/claim_context_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish additive machine-quote context review flags'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
